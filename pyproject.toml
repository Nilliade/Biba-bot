[project]
name = "biba-bot"
version = "1.0.0"
description = "Discord-бот с игрой «Угадай мелодию»: ставки, множители за скорость и ротация ведущего"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4,<3.0",
    "yt-dlp>=2024.12.13",
    "rapidfuzz>=3.9.0",
    "Unidecode>=1.3.8",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:discord.player",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
